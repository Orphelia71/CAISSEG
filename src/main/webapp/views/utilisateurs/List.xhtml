<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListUtilisateursTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <div class="card shadow-sm"><div class="card-body">
            <h:form styleClass="jsfcrud_list_form">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h:commandLink styleClass="btn btn-success" action="#{utilisateursController.prepareCreate}" value="#{bundle.ListUtilisateursCreateLink}"/>
                </div>
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorClass="alert alert-danger" infoClass="alert alert-success" layout="list" styleClass="list-unstyled"/>
                </h:panelGroup>
                <h:outputText styleClass="text-muted" escape="false" value="#{bundle.ListUtilisateursEmpty}" rendered="#{utilisateursController.items.rowCount == 0}"/>
                <h:panelGroup rendered="#{utilisateursController.items.rowCount > 0}">
                    <span class="text-muted me-2"><h:outputText value="#{utilisateursController.pagination.pageFirstItem + 1}..#{utilisateursController.pagination.pageLastItem + 1}/#{utilisateursController.pagination.itemsCount}"/></span>
                    <h:commandLink styleClass="btn btn-sm btn-outline-secondary" action="#{utilisateursController.previous}" value="#{bundle.Previous} #{utilisateursController.pagination.pageSize}" rendered="#{utilisateursController.pagination.hasPreviousPage}"/>
                    <h:commandLink styleClass="btn btn-sm btn-outline-secondary" action="#{utilisateursController.next}" value="#{bundle.Next} #{utilisateursController.pagination.pageSize}" rendered="#{utilisateursController.pagination.hasNextPage}"/>
                    <h:dataTable value="#{utilisateursController.items}" var="item" styleClass="table table-striped table-hover align-middle mb-3" headerClass="table-light">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUtilisateursTitle_id}"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUtilisateursTitle_nom}"/>
                            </f:facet>
                            <h:outputText value="#{item.nom}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUtilisateursTitle_prenom}"/>
                            </f:facet>
                            <h:outputText value="#{item.prenom}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUtilisateursTitle_login}"/>
                            </f:facet>
                            <h:outputText value="#{item.login}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUtilisateursTitle_motDePasse}"/>
                            </f:facet>
                            <h:outputText value="••••••"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUtilisateursTitle_role}"/>
                            </f:facet>
                            <h:outputText value="#{item.role}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUtilisateursTitle_actif}"/>
                            </f:facet>
                            <span class="badge #{item.actif ? 'text-bg-success' : 'text-bg-secondary'}">#{item.actif ? 'Actif' : 'Inactif'}</span>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListUtilisateursTitle_dateCreation}"/>
                            </f:facet>
                            <h:outputText value="#{item.dateCreation}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value=""/>
                            </f:facet>
                            <h:commandLink styleClass="btn btn-info btn-sm" action="#{utilisateursController.prepareView}" value="#{bundle.ListUtilisateursViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink styleClass="btn btn-warning btn-sm" action="#{utilisateursController.prepareEdit}" value="#{bundle.ListUtilisateursEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink styleClass="btn btn-danger btn-sm" action="#{utilisateursController.destroy}" value="#{bundle.ListUtilisateursDestroyLink}"/>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
            </h:form>
        </div></div>
        </ui:define>
    </ui:composition>

</html>

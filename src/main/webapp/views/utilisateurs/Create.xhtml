<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">
    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.CreateUtilisateursTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <div class="card shadow-sm"><div class="card-body">
            <h:panelGroup id="messagePanel" layout="block">
                <h:messages errorClass="alert alert-danger" infoClass="alert alert-success" layout="list" styleClass="list-unstyled"/>
            </h:panelGroup>
            <h:form>
                <h:panelGrid columns="2" styleClass="form-grid" columnClasses="form-col-label,form-col-input">
                    <h:outputLabel styleClass="form-label fw-semibold" value="#{bundle.CreateUtilisateursLabel_nom}" for="nom" />
                    <h:inputText styleClass="form-control" id="nom" value="#{utilisateursController.selected.nom}" title="#{bundle.CreateUtilisateursTitle_nom}" required="true" requiredMessage="#{bundle.CreateUtilisateursRequiredMessage_nom}"/>
                    <h:outputLabel styleClass="form-label fw-semibold" value="#{bundle.CreateUtilisateursLabel_prenom}" for="prenom" />
                    <h:inputText styleClass="form-control" id="prenom" value="#{utilisateursController.selected.prenom}" title="#{bundle.CreateUtilisateursTitle_prenom}" required="true" requiredMessage="#{bundle.CreateUtilisateursRequiredMessage_prenom}"/>
                    <h:outputLabel styleClass="form-label fw-semibold" value="#{bundle.CreateUtilisateursLabel_login}" for="login" />
                    <h:inputText styleClass="form-control" id="login" value="#{utilisateursController.selected.login}" title="#{bundle.CreateUtilisateursTitle_login}" required="true" requiredMessage="#{bundle.CreateUtilisateursRequiredMessage_login}"/>
                    <h:outputLabel styleClass="form-label fw-semibold" value="#{bundle.CreateUtilisateursLabel_motDePasse}" for="motDePasse" />
                    <h:inputSecret redisplay="true" styleClass="form-control" id="motDePasse" value="#{utilisateursController.selected.motDePasse}" title="#{bundle.CreateUtilisateursTitle_motDePasse}" required="true" requiredMessage="#{bundle.CreateUtilisateursRequiredMessage_motDePasse}"/>
                    <h:outputLabel styleClass="form-label fw-semibold" value="#{bundle.CreateUtilisateursLabel_role}" for="role" />
                    <h:selectOneMenu styleClass="form-select" id="role" value="#{utilisateursController.selected.role}" title="#{bundle.CreateUtilisateursTitle_role}" required="true" requiredMessage="#{bundle.CreateUtilisateursRequiredMessage_role}"><f:selectItem itemValue="CAISSIER" itemLabel="Gérant"/><f:selectItem itemValue="RESPONSABLE" itemLabel="Responsable (administrateur)"/></h:selectOneMenu>
                    <h:outputLabel styleClass="form-label fw-semibold" value="#{bundle.CreateUtilisateursLabel_actif}" for="actif" />
                    <h:selectBooleanCheckbox styleClass="form-check-input" id="actif" value="#{utilisateursController.selected.actif}" title="#{bundle.CreateUtilisateursTitle_actif}" />
                    <h:outputLabel styleClass="form-label fw-semibold" value="#{bundle.CreateUtilisateursLabel_dateCreation}" for="dateCreation" />
                    <h:inputText styleClass="form-control" id="dateCreation" readonly="true" value="#{utilisateursController.selected.dateCreation}" title="#{bundle.CreateUtilisateursTitle_dateCreation}">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                    </h:inputText>
                </h:panelGrid>
                <h:commandLink styleClass="btn btn-primary" action="#{utilisateursController.create}" value="#{bundle.CreateUtilisateursSaveLink}" />
                <h:commandLink styleClass="btn btn-outline-secondary" action="#{utilisateursController.prepareList}" value="#{bundle.CreateUtilisateursShowAllLink}" immediate="true"/>
            </h:form>
        </div></div>
        </ui:define>
    </ui:composition>

</html>

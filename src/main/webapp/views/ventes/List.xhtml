<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListVentesTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <div class="card shadow-sm"><div class="card-body">
            <h:form styleClass="jsfcrud_list_form">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h:commandLink styleClass="btn btn-success" action="#{ventesController.prepareCreate}" value="#{bundle.ListVentesCreateLink}"/>
                </div>
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorClass="alert alert-danger" infoClass="alert alert-success" layout="list" styleClass="list-unstyled"/>
                </h:panelGroup>
                <h:outputText styleClass="text-muted" escape="false" value="#{bundle.ListVentesEmpty}" rendered="#{ventesController.items.rowCount == 0}"/>
                <h:panelGroup rendered="#{ventesController.items.rowCount > 0}">
                    <span class="text-muted me-2"><h:outputText value="#{ventesController.pagination.pageFirstItem + 1}..#{ventesController.pagination.pageLastItem + 1}/#{ventesController.pagination.itemsCount}"/></span>
                    <h:commandLink styleClass="btn btn-sm btn-outline-secondary" action="#{ventesController.previous}" value="#{bundle.Previous} #{ventesController.pagination.pageSize}" rendered="#{ventesController.pagination.hasPreviousPage}"/>
                    <h:commandLink styleClass="btn btn-sm btn-outline-secondary" action="#{ventesController.next}" value="#{bundle.Next} #{ventesController.pagination.pageSize}" rendered="#{ventesController.pagination.hasNextPage}"/>
                    <h:dataTable value="#{ventesController.items}" var="item" styleClass="table table-striped table-hover align-middle mb-3" headerClass="table-light">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVentesTitle_id}"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVentesTitle_description}"/>
                            </f:facet>
                            <h:outputText value="#{item.description}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVentesTitle_montant}"/>
                            </f:facet>
                            <h:outputText value="#{item.montant}"><f:convertNumber pattern="#,##0.##" /></h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVentesTitle_modePaiement}"/>
                            </f:facet>
                            <h:outputText value="#{item.modePaiement}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVentesTitle_dateVente}"/>
                            </f:facet>
                            <h:outputText value="#{item.dateVente}">
                                <f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
                            </h:outputText>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVentesTitle_caisseId}"/>
                            </f:facet>
                            <h:outputText value="#{item.caisseId}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListVentesTitle_caissierId}"/>
                            </f:facet>
                            <h:outputText value="#{item.caissierId}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value=""/>
                            </f:facet>
                            <h:outputLink styleClass="btn btn-secondary btn-sm" value="#{request.contextPath}/reports/recu" target="_blank" title="Reçu PDF"><f:param name="id" value="#{item.id}"/><i class="fas fa-file-pdf"></i> Reçu</h:outputLink>
                            <h:outputText value=" "/>
                            <h:link outcome="/views/ventes/Mail.xhtml" styleClass="btn btn-secondary btn-sm" title="Envoyer le reçu par e-mail"><f:param name="id" value="#{item.id}" /><i class="fas fa-envelope"></i> E-mail</h:link>                            <h:outputText value=" "/>
                            <h:commandLink styleClass="btn btn-info btn-sm" action="#{ventesController.prepareView}" value="#{bundle.ListVentesViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink styleClass="btn btn-warning btn-sm" action="#{ventesController.prepareEdit}" value="#{bundle.ListVentesEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink styleClass="btn btn-danger btn-sm" action="#{ventesController.destroy}" value="#{bundle.ListVentesDestroyLink}"/>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
            </h:form>
        </div></div>
        </ui:define>
    </ui:composition>

</html>

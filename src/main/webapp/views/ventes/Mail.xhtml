<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="/template.xhtml">
        <ui:define name="metadata">
            <f:viewParam name="id" value="#{receiptMailController.id}" />
            <f:viewAction action="#{receiptMailController.init}" />
        </ui:define>
        <ui:define name="title">Envoyer le re&#231;u par e-mail</ui:define>
        <ui:define name="body">
            <div class="card shadow-sm"><div class="card-body">
                <h:panelGroup rendered="#{receiptMailController.vente == null}">
                    <div class="alert alert-danger">Vente introuvable.</div>
                </h:panelGroup>
                <h:panelGroup rendered="#{receiptMailController.vente != null}">
                    <p class="text-muted mb-3">
                        Vente n&#176; <b><h:outputText value="#{receiptMailController.vente.id}" /></b> &#8212;
                        <h:outputText value="#{receiptMailController.vente.description}" /> &#8212;
                        <b><h:outputText value="#{receiptMailController.vente.montant}"><f:convertNumber pattern="#,##0.##" /></h:outputText> FCFA</b>
                    </p>
                    <h:form>
                        <h:messages errorClass="alert alert-danger" infoClass="alert alert-success" layout="list" styleClass="list-unstyled"/>
                        <div class="mb-3" style="max-width: 480px;">
                            <label class="form-label fw-semibold" for="email">Adresse e-mail du client</label>
                            <h:inputText id="email" value="#{receiptMailController.email}" styleClass="form-control"
                                         required="true" requiredMessage="L'adresse e-mail est obligatoire.">
                                <f:validateRegex pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$" />
                            </h:inputText>
                        </div>
                        <h:commandLink styleClass="btn btn-primary" action="#{receiptMailController.send}">
                            <i class="fas fa-paper-plane"></i> Envoyer le re&#231;u
                        </h:commandLink>
                        <h:outputLink styleClass="btn btn-outline-secondary" value="#{request.contextPath}/reports/recu" target="_blank">
                            <f:param name="id" value="#{receiptMailController.id}" /><i class="fas fa-file-pdf"></i> Voir le PDF
                        </h:outputLink>
                        <h:outputLink styleClass="btn btn-outline-secondary" value="#{request.contextPath}/views/ventes/List.xhtml">
                            Retour aux ventes
                        </h:outputLink>
                    </h:form>
                </h:panelGroup>
            </div></div>
        </ui:define>
    </ui:composition>
</html>

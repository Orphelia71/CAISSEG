<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <ui:composition template="/template.xhtml">
        <ui:define name="title">
            <h:outputText value="#{bundle.ListCaissesTitle}"></h:outputText>
        </ui:define>
        <ui:define name="body">
            <div class="card shadow-sm"><div class="card-body">
            <h:form styleClass="jsfcrud_list_form">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h:commandLink styleClass="btn btn-success" action="#{caissesController.prepareCreate}" value="#{bundle.ListCaissesCreateLink}"/>
                </div>
                <h:panelGroup id="messagePanel" layout="block">
                    <h:messages errorClass="alert alert-danger" infoClass="alert alert-success" layout="list" styleClass="list-unstyled"/>
                </h:panelGroup>
                <h:outputText styleClass="text-muted" escape="false" value="#{bundle.ListCaissesEmpty}" rendered="#{caissesController.items.rowCount == 0}"/>
                <h:panelGroup rendered="#{caissesController.items.rowCount > 0}">
                    <span class="text-muted me-2"><h:outputText value="#{caissesController.pagination.pageFirstItem + 1}..#{caissesController.pagination.pageLastItem + 1}/#{caissesController.pagination.itemsCount}"/></span>
                    <h:commandLink styleClass="btn btn-sm btn-outline-secondary" action="#{caissesController.previous}" value="#{bundle.Previous} #{caissesController.pagination.pageSize}" rendered="#{caissesController.pagination.hasPreviousPage}"/>
                    <h:commandLink styleClass="btn btn-sm btn-outline-secondary" action="#{caissesController.next}" value="#{bundle.Next} #{caissesController.pagination.pageSize}" rendered="#{caissesController.pagination.hasNextPage}"/>
                    <h:dataTable value="#{caissesController.items}" var="item" styleClass="table table-striped table-hover align-middle mb-3" headerClass="table-light">
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCaissesTitle_id}"/>
                            </f:facet>
                            <h:outputText value="#{item.id}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCaissesTitle_numero}"/>
                            </f:facet>
                            <h:outputText value="#{item.numero}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCaissesTitle_libelle}"/>
                            </f:facet>
                            <h:outputText value="#{item.libelle}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCaissesTitle_etat}"/>
                            </f:facet>
                            <span class="badge #{item.etat.toLowerCase().startsWith('dispo') ? 'text-bg-success' : (item.etat.toLowerCase().startsWith('occup') ? 'text-bg-danger' : 'text-bg-warning')}">#{item.etat.toLowerCase().startsWith('dispo') ? 'Disponible' : (item.etat.toLowerCase().startsWith('occup') ? 'Occupée' : 'En maintenance')}</span>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value="#{bundle.ListCaissesTitle_caissierId}"/>
                            </f:facet>
                            <h:outputText value="#{item.caissierId}"/>
                        </h:column>
                        <h:column>
                            <f:facet name="header">
                                <h:outputText value=""/>
                            </f:facet>
                            <h:commandLink styleClass="btn btn-info btn-sm" action="#{caissesController.prepareView}" value="#{bundle.ListCaissesViewLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink styleClass="btn btn-warning btn-sm" action="#{caissesController.prepareEdit}" value="#{bundle.ListCaissesEditLink}"/>
                            <h:outputText value=" "/>
                            <h:commandLink styleClass="btn btn-danger btn-sm" action="#{caissesController.destroy}" value="#{bundle.ListCaissesDestroyLink}"/>
                        </h:column>
                    </h:dataTable>
                </h:panelGroup>
            </h:form>
        </div></div>
        </ui:define>
    </ui:composition>

</html>

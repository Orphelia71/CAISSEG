<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

    <f:metadata><ui:insert name="metadata" /></f:metadata>

    <h:head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title><ui:insert name="title">CAISSEG</ui:insert> | CAISSEG</title>

        <!-- AdminLTE 4 (Bootstrap 5) + icones, charges depuis un CDN -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.10.1/styles/overlayscrollbars.min.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/css/adminlte.min.css" />
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
        <h:outputStylesheet name="css/caisseg.css" />
    </h:head>

    <h:body styleClass="layout-fixed sidebar-expand-lg bg-body-tertiary">
        <div class="app-wrapper">

            <!-- En-tete -->
            <nav class="app-header navbar navbar-expand bg-body">
                <div class="container-fluid">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button" title="Menu">
                                <i class="fas fa-bars"></i>
                            </a>
                        </li>
                        
                    </ul>
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item d-none d-sm-block me-3">
                            <span class="text-muted"><i class="fas fa-user-circle me-1"></i>
                                <h:outputText value="#{authController.fullName}" /> &#8212;
                                <h:outputText value="#{authController.roleLabel}" /></span>
                        </li>
                        <li class="nav-item">
                            <h:form styleClass="m-0">
                                <h:commandLink action="#{authController.logout}" styleClass="btn btn-outline-danger btn-sm">
                                    <i class="fas fa-right-from-bracket"></i> D&#233;connexion
                                </h:commandLink>
                            </h:form>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Menu lateral -->
            <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
                <div class="sidebar-brand">
                    <a href="#{authController.admin ? request.contextPath.concat('/index.xhtml') : request.contextPath.concat('/views/ventes/List.xhtml')}" class="brand-link">
                        <i class="fas fa-cash-register brand-image ms-3"></i>
                        <span class="brand-text fw-light">CAISSEG</span>
                    </a>
                </div>
                <div class="sidebar-wrapper">
                    <nav class="mt-2">
                        <ul class="nav sidebar-menu flex-column" role="menu">
                            <ui:fragment rendered="#{authController.admin}">
                                <li class="nav-item">
                                    <a href="#{request.contextPath}/index.xhtml"
                                       class="nav-link #{request.requestURI.endsWith('/index.xhtml') ? 'active' : ''}">
                                        <i class="nav-icon fas fa-gauge"></i><p>Tableau de bord</p>
                                    </a>
                                </li>
                                <li class="nav-header">GESTION</li>
                            </ui:fragment>
                            <li class="nav-item">
                                <a href="#{request.contextPath}/views/ventes/List.xhtml"
                                   class="nav-link #{request.requestURI.contains('/views/ventes/') ? 'active' : ''}">
                                    <i class="nav-icon fas fa-shopping-cart"></i><p>Ventes</p>
                                </a>
                            </li>
                            <ui:fragment rendered="#{authController.admin}">
                                <li class="nav-item">
                                    <a href="#{request.contextPath}/views/caisses/List.xhtml"
                                       class="nav-link #{request.requestURI.contains('/views/caisses/') ? 'active' : ''}">
                                        <i class="nav-icon fas fa-cash-register"></i><p>Caisses</p>
                                    </a>
                                </li>
                                <li class="nav-item">
                                    <a href="#{request.contextPath}/views/utilisateurs/List.xhtml"
                                       class="nav-link #{request.requestURI.contains('/views/utilisateurs/') ? 'active' : ''}">
                                        <i class="nav-icon fas fa-users"></i><p>Utilisateurs</p>
                                    </a>
                                </li>
                            </ui:fragment>
                        </ul>
                    </nav>
                </div>
            </aside>

            <!-- Contenu -->
            <main class="app-main">
                <div class="app-content-header">
                    <div class="container-fluid">
                        <h3 class="mb-0"><ui:insert name="title">Titre</ui:insert></h3>
                    </div>
                </div>
                <div class="app-content">
                    <div class="container-fluid">
                        <ui:insert name="body">Contenu</ui:insert>
                    </div>
                </div>
            </main>

            <footer class="app-footer">
                <div class="float-end d-none d-sm-inline">Gestion de caisse</div>
                <strong>CAISSEG</strong>
            </footer>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/overlayscrollbars@2.10.1/browser/overlayscrollbars.browser.es6.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0/dist/js/adminlte.min.js"></script>
    </h:body>
</html>
